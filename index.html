<style>
  html, body { margin: 0; height: 100%; background: #10120e; overflow: hidden; }
  /* Same picture, blurred and enlarged, only to fill the bars when the screen is not 16:9. */
  .fill { position: fixed; inset: 0; background: url("coming-soon.webp") center / cover no-repeat;
          filter: blur(28px) brightness(.85); transform: scale(1.15); }
  /* The official picture itself: whole, uncropped, centred. */
  .box { position: fixed; inset: 0; display: grid; place-items: center; }
  .art { display: block; width: 100%; height: 100%; object-fit: contain; }
  /* On tall screens (phones upright) the picture would show a hard edge against the blurred bars: soften only that edge. */
  @media (max-aspect-ratio: 16/10) {
    .box { align-content: center; }
    .art { width: 100vw; height: auto; aspect-ratio: 16/9; max-height: 100dvh;
           -webkit-mask-image: linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent);
           mask-image: linear-gradient(to bottom, transparent, #000 7%, #000 93%, transparent); }
  }
</style>
<link rel="stylesheet" href="beta/beta.css">
</head>
<body>
  <div class="fill" aria-hidden="true"></div>
  <div class="box"><img class="art" src="coming-soon.webp" width="1920" height="1080" alt="LOUDOUT — Coming Soon"></div>
<script src="beta/beta.js" defer></script>
</body>
